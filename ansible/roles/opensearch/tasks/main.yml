---
# tasks file for opensearch

- name: Raise mmap limit for Opensearch proper operation
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: '262144'
    state: present
    reload: yes

- name: Create Opensearch and Opensearch Dashboards data directories
  file:
    path: "/opt/{{ item.value.name }}"
    state: directory
    mode: '0755'
    owner: "{{ item.value.owner }}"
  register: directories
  loop: "{{ dirs | dict2items}}"
  vars:
    dirs:
      opensearch:
        name: opensearch_data
        owner: "{{ opensearch_user_id }}"
      docker-compose:
        name: observability_stack_docker/opensearch
        owner: docker

- name: Generate files from templates
  template:
    src: docker-compose.yaml.j2
    dest: "{{ directories.results[1].path }}/docker-compose.yaml"
    mode: "0644"
    owner: "{{ opensearch_user_id }}"
  no_log: true

- name: Create .env files in docker-compose directory on the remote host
  template:
    src: "{{ item.value.src }}"
    dest: "{{ item.value.dest }}"
    mode: '0400'
    owner: "{{ opensearch_user_id }}"
  loop: "{{ env_files | dict2items }}"
  vars:
    env_files:
      opensearch:
        src: opensearch.env.j2
        dest: "{{ directories.results[1].path }}/opensearch.env"
      opensearch-dashboards:
        src: opensearch-dashboards.env.j2
        dest: "{{ directories.results[1].path }}/opensearch-dashboards.env"


- name: Start Opensearch and Opensearch Dashboards compose file
  community.docker.docker_compose_v2:
    project_src: "{{ directories.results[1].path }}"
  register: docker_compose_result
  until: docker_compose_result is succeeded
  retries: 5
  delay: 10

- name: Copy Opensearch Dashboards config to remote host temp directory
  copy:
    src: dashboards_config.ndjson
    dest: /tmp/dashboards_config.ndjson
    mode: '0600'

- name: Wait for Opensearch Dashboards to start listening on port 5601
  wait_for:
    port: 5601
    host: 127.0.0.1
    delay: 10
    timeout: 120

- name: Import Opensearch Dashboards config
  command: >
    curl -s -f -X POST "http://localhost:5601/api/saved_objects/_import?overwrite=true"
    -H "osd-xsrf: true"
    -u "admin:{{ opensearch_credentials.password }}"
    -F "file=@/tmp/dashboards_config.ndjson"
  no_log: true

- name: Clean up temp config file on remote host
  file:
    path: /tmp/dashboards_config.ndjson
    state: absent