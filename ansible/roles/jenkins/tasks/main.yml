---
# tasks file for role/jenkins

- name: Load dynamic IP variables generated by Terraform
  include_vars:
    file: ips.yml
    name: ips

- name: Create Jenkins directories
  file:
    path: "/opt/{{ item }}"
    state: directory
    mode: '0755'
  register: jenkins_dir
  loop:
    - jenkins
    - jenkins_data

- name: Generate a templated file for Jenkins configuration
  template:
    src: casc.yaml.j2
    dest: "{{ jenkins_dir.results[0].path }}/casc.yaml"
    mode: '0600'
    owner: "{{ os_user }}"

- name: Copy necessary files to Jenkins directory on the server
  copy:
    src: "{{ item.value.src }}"
    dest: "{{ item.value.dest }}"
  loop: "{{ files | dict2items }}"
  vars:
    files:
      dockerfile:
        src: Dockerfile
        dest: "{{ jenkins_dir.results[0].path }}/Dockerfile"
      compose:
        src: docker-compose.yaml
        dest: "{{ jenkins_dir.results[0].path }}/docker-compose.yaml"
      plugins:
        src: plugins.txt
        dest: "{{ jenkins_dir.results[0].path }}/plugins.txt"
      job:
        src: job.groovy
        dest: "{{ jenkins_dir.results[1].path }}/job.groovy"

- name: Start Jenkins container
  community.docker.docker_compose_v2:
    project_src: "{{ jenkins_dir.results[0].path }}"
    build: always