---
# tasks file for observability
- name: Load dynamic IP variables generated by Terraform
  include_vars:
    file: "{{ playbook_dir }}/ips.yml"
    name: ips

- name: Create grafana and docker users
  user:
    name: "{{ item }}"
    system: yes
    create_home: no
    shell: /usr/sbin/nologin
  loop:
    - grafana
    - docker

- name: Create Prometheus and Grafana home directories
  file:
    path: "/opt/{{ item.value.name }}"
    state: directory
    mode: '0755'
    owner: "{{ item.value.owner }}"
  register: directories
  loop: "{{ dirs | dict2items}}"
  vars:
    dirs:
      prometheus:
        name: prometheus_data
        owner: "{{ prometheus_user_id }}"
      grafana:
        name: grafana_data
        owner: "{{ grafana_user_id }}"
      docker-compose:
        name: observability_stack_docker
        owner: docker

- name: Generate config files from templates
  template:
    src: "{{ item.value.src }}"
    dest: "{{ item.value.dest }}"
  loop: "{{ templates | dict2items }}"
  vars:
    templates:
      prometheus:
        src: prometheus.yml.j2
        dest: "{{ directories.results[0].path }}/prometheus.yml"
      grafana-datasource:
        src: datasource.yml.j2
        dest: "{{ directories.results[1].path }}/datasource.yml"
      grafana-dashboard-provider:
        src: dashboard_provider.yml.j2
        dest: "{{ directories.results[1].path }}/dashboard_provider.yml"
      docker-compose:
        src: docker-compose.yaml.j2
        dest: "{{ directories.results[2].path }}/docker-compose.yaml"

- name: Copy node exporter dashboard file to grafana home directory
  copy:
    src: node_exporter_full.json
    dest: "{{ directories.results[1].path }}/node_exporter_full.json"
    mode: '0755'
    owner: "{{ grafana_user_id }}"

- name: Copy grafana sercrets to grafana home directory
  copy:
    dest: "{{ item.value.dest }}"
    content: "{{ item.value.content }}"
    mode: '0400'
    owner: "{{ grafana_user_id }}"
  loop: "{{ secrets | dict2items }}"
  vars:
    secrets:
      username:
        dest: "{{ directories.results[1].path }}/admin_user.secret"
        content: "{{ grafana_credentials.username }}"
      password:
        dest: "{{ directories.results[1].path }}/admin_password.secret"
        content: "{{ grafana_credentials.password }}"

- name: Start Grafana and Prometheus compose file
  community.docker.docker_compose_v2:
    project_src: "{{ directories.results[2].path }}"
  register: docker_compose_result
  until: docker_compose_result is succeeded
  retries: 5
  delay: 10