---
# tasks file for role/docker
- name: Install packages required for GPG key acquisition
  apt:
    pkg: "{{ required_packages.gpg }}"
    state: present
    update_cache: yes
  timeout: 90

- name: Create keyrings directory
  file:
    state: directory
    mode: '0755'
    dest: "{{ keyring_path }}"

- name: Download GPG key
  get_url:
    url: "{{ docker_gpg_key_url }}"
    dest: "{{ keyring_path }}/docker.asc"
    mode: '0444'
    timeout: 30
  register: gpg_download_result
  until: gpg_download_result is succeeded
  retries: 5
  delay: 10

- name: Install Docker APT repository
  deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_apt_repository_url }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: "{{ keyring_path }}/docker.asc"

- name: Install Docker packages
  apt:
    name: "{{ required_packages.docker }}"
    state: present
    update_cache: yes
  timeout: 120

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  user:
    name: ubuntu
    groups:
      - docker
    append: True