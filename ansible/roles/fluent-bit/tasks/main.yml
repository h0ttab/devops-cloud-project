---
# tasks file for fluent-bit

- name: Load dynamic IP variables generated by Terraform
  include_vars:
    file: "{{ playbook_dir }}/ips.yml"
    name: ips

- name: Create keyrings directory
  file:
    state: directory
    mode: '0755'
    dest: "{{ keyring_path }}"

- name: Download Fluent Bit GPG key
  get_url:
    url: "{{ fluentbit_gpg_key_url }}"
    dest: "{{ keyring_path }}/fluentbit.asc"
    mode: '0444'
    timeout: 30
  register: gpg_key
  until: gpg_key is succeeded
  retries: 5
  delay: 10

- name: Install Fluent Bit APT repository
  deb822_repository:
    name: fluentbit
    types: deb
    uris: "{{ fluentbit_apt_repository_url }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: amd64
    signed_by: "{{ gpg_key.dest }}"

- name: Install Fluent Bit package
  apt:
    name: "fluent-bit={{ fluent_bit_version }}"
    state: present
    update_cache: yes
  timeout: 120

- name: Create Fluent Bit config override directory
  file:
    state: directory
    path: /etc/systemd/system/fluent-bit.service.d/
  register: fluent_bit_override_dir

- name: Override Fluent Bit service user in config
  copy:
    dest: "{{ fluent_bit_override_dir.path }}/override.conf"
    content: |
      [Service]
      User=root
      Group=root
      ExecStart=
      ExecStart=/opt/fluent-bit/bin/fluent-bit -c /etc/fluent-bit/fluent-bit.yaml
    
- name: Generate Fluent Bit config file from a template
  template:
    src: fluent-bit.yaml.j2
    dest: /etc/fluent-bit/fluent-bit.yaml
    mode: '0400'
  no_log: true
  notify: restart fluent-bit

- name: Run fluent-bit systemd
  systemd_service:
    state: started
    name: fluent-bit.service
    enabled: yes
    daemon_reload: yes