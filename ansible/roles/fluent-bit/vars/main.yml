---
# vars file for fluent-bit

keyring_path: /etc/apt/keyrings

fluentbit_gpg_key_url: https://packages.fluentbit.io/fluentbit.key
fluentbit_apt_repository_url: "https://packages.fluentbit.io/ubuntu/{{ ansible_facts['distribution_release'] }}"
opensearch_credentials: "{{ lookup('file', playbook_dir ~ '/../secrets/opensearch/credentials.json') | from_json }}"