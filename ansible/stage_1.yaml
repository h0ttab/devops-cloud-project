
---

- name: Setup application server
  hosts: app_node
  become: true
  roles:
    - docker
    - node-exporter
    - application-server
    - fluent-bit

- name: Setup observability server
  hosts: obs_node
  become: true
  roles:
    - docker
    - node-exporter
    - fluent-bit

- name: Setup CI/CD server
  hosts: ci_node
  become: true
  roles:
    - docker
    - node-exporter
    - vault
    - fluent-bit